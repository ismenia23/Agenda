<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>
            Página Inicial - Aula WEB
        </title>
        <link rel="stylesheet" href="../aula 29-05/css/estilo.css">
    </head> 
    <body>
        <header>
            <h1>Cadastro de Contatos</h1>
            <nav>
                <ul>
                     <li><a href="index.html">Início</a></li>
    <li><a href="#">Cadastro de Tarefas</a></li>
    <li><a href="#">Opções</a></li>
    <li><a href="#">Configurações</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <form onsubmit="">
                <label>Nome:</label><br>
                <input type="text" 
                id="nome" name="nome" 
                placeholder="Insira o nome aqui" required>
                <br><br>
                
                <label>E-mail:</label><br>
                <input type="email" id="email" 
                name="email"
                placeholder="Insira seu e-mail aqui"
                required>
                <br><br>

                <label>
                    Telefone
                </label>
                <br>
                <input type="tel" 
                id="telefone"
                name="telefone"
                placeholder="Insira seu telefone aqui"
                required>
                <br><br>
                <button type="submit">Enviar</button>
            </form>
            <br><br>
            <hr>
            <h2>Lista de Contatos</h2>
            <table id="tabelacontatos" border="1">
                <thead>
                    <tr>
                        <th><strong>Nome</strong></th>
                        <th><strong>E-mail</strong></th>
                        <th><em>Telefone</em></th>
                    </tr>
                    <tbody>

                    </tbody>
                </thead>
            </table>
        </main>
        <br><br><br>
        <footer>
            Contato: <br>
            <a href="https://globo.com" target="_blank">
                <img src="../aula 29-05/img/instagram_logo.png" 
                width="30px">
            </a>
        </footer>

        <script> src="../aula 29-05/javascript.js/javascript.js"

        </script>
    </body>   
</html>
